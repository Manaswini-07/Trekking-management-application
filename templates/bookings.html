<!DOCTYPE html>
<html>
<head>
    <title>My Bookings</title>
</head>
<body>

<h2>My Bookings</h2>

<table border="1">

<tr>
    <th>Booking ID</th>
    <th>Trek ID</th>
    <th>Status</th>
</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.id }}</td>
<td>{{ booking.trek_id }}</td>
<td>{{ booking.status }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/user">Back</a>

</body>
</html>
