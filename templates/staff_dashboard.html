<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
</head>
<body>

<h1>Staff Dashboard</h1>

<hr>

<h2>Assigned Treks</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Location</th>
    <th>Slots</th>
    <th>Status</th>
    <th>Participants</th>
    <th>Action</th>
</tr>

{% for trek in treks %}

<tr>

<td>{{ trek.id }}</td>
<td>{{ trek.trek_name }}</td>
<td>{{ trek.location }}</td>
<td>{{ trek.slots }}</td>
<td>{{ trek.status }}</td>
<td>{{ trek.booking_count }}</td>

<td>

<form action="/update_trek/{{ trek.id }}" method="POST">

<select name="status">
<option value="Open">Open</option>
<option value="Closed">Closed</option>
<option value="Completed">Completed</option>
</select>

<input type="number"
name="slots"
value="{{ trek.slots }}">

<button type="submit">

Update

</button>

</form>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/logout">Logout</a>

</body>
</html>
